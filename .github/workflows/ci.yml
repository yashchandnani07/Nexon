name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Repository checks: forbidden files, branding, secrets in contents, compose config
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run scripts/ci_checks.sh
        run: ./scripts/ci_checks.sh all

  # 2. Python syntax of every tracked .py file
  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all tracked Python files
        run: |
          files=$(git ls-files '*.py')
          if [ -z "$files" ]; then echo "no Python files"; exit 0; fi
          echo "$files" | xargs python -m py_compile
          echo "$(echo "$files" | wc -l) files compiled"

  # 3. Find every service Dockerfile
  detect-services:
    name: Detect Docker services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.detector.outputs.services }}
      has_services: ${{ steps.detector.outputs.has_services }}
    steps:
      - uses: actions/checkout@v4
      - name: Discover Dockerfiles
        id: detector
        run: |
          python3 - <<'PY'
          import glob, json, os
          targets = []
          for df in sorted(glob.glob('**/Dockerfile*', recursive=True)):
              df = df.replace('\\', '/')
              if any(s in df for s in ('node_modules', 'smtp-fraud-gateway-2', 'Dockerfile.garak')):
                  continue
              ctx = os.path.dirname(df) or '.'
              if df.startswith('sandbox/docker/'):
                  ctx = 'sandbox'
              targets.append({'name': df.replace('/', '_').lower(), 'dockerfile': df, 'context': ctx})
          print(f'{len(targets)} Dockerfile(s):')
          for t in targets:
              print(f"  {t['dockerfile']} (context: {t['context']})")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'services={json.dumps(targets)}\n')
              f.write(f"has_services={'true' if targets else 'false'}\n")
          PY

  # 4. Build every service image
  build-services:
    name: Build ${{ matrix.target.dockerfile }}
    needs: [checks, detect-services]
    if: needs.detect-services.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.detect-services.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (ML images are large)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.target.dockerfile }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.target.context }}
          file: ${{ matrix.target.dockerfile }}
          push: false
          tags: ci-${{ matrix.target.name }}:latest
          cache-from: type=gha,scope=${{ matrix.target.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.name }}

  # 5. Frontend: reproducible install and production build
  frontend:
    name: Frontend build
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Detect Frontend
        id: fe
        run: |
          if [ -f Frontend/package.json ]; then
            if [ ! -f Frontend/package-lock.json ]; then
              echo "::error::Frontend/package.json exists but Frontend/package-lock.json is missing. Run npm install and commit the lock file."
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Frontend not on this branch yet, skipped"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.fe.outputs.exists == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Install (npm ci)
        if: steps.fe.outputs.exists == 'true'
        working-directory: Frontend
        run: npm ci
      - name: Build
        if: steps.fe.outputs.exists == 'true'
        working-directory: Frontend
        run: npm run build

  # 6. Single required status for branch protection
  ci-passed:
    name: CI passed
    if: always()
    needs: [checks, python-syntax, detect-services, build-services, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          echo '${{ toJson(needs) }}' | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          print(bad or "all jobs passed or skipped")
          sys.exit(1 if bad else 0)
          '
